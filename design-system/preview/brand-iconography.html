<!doctype html>
<html><head><meta charset="utf-8"/><title>Brand · Iconography</title>
<link rel="stylesheet" href="_card.css"/>
<style>
  .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; padding: 6px 0; }
  .ico { aspect-ratio: 1; border: 1px solid var(--border); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; background: #fff; color: var(--hmn-green); }
  .ico svg { width: 60%; height: 60%; }
  .legend { font-family: var(--font-mono); font-size: 10px; color: var(--fg-subtle); display: flex; gap: 12px; }
  .legend b { color: var(--hmn-green); font-weight: 600; }
</style></head>
<body>
<div class="card">
  <div class="row" style="justify-content:space-between">
    <div class="label">Iconography · 24px outline, 1.5px stroke</div>
    <div class="meta">brand</div>
  </div>
  <div class="grid">
    <!-- 10 heroicons-style outlines, drawn inline -->
    <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v9h6v-6h6v6h6v-9L12 3z"/></svg></div>
    <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg></div>
    <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V10l9-7 9 7v11H3z"/></svg></div>
    <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="13" width="4" height="8"/><rect x="10" y="8" width="4" height="13"/><rect x="17" y="3" width="4" height="18"/></svg></div>
    <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l-4 5 4 5M16 7l4 5-4 5M14 5l-4 14"/></svg></div>
    <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
    <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 7 7 .8-5 5 1.5 7L12 18l-6.5 3.8L7 14.8l-5-5L9 9z"/></svg></div>
    <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2l8 4v6c0 5-3 8-8 10-5-2-8-5-8-10V6z"/></svg></div>
    <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M7 12h10"/></svg></div>
    <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c3-7 15-7 18 0M3 12c3 7 15 7 18 0"/><circle cx="12" cy="12" r="3"/></svg></div>
  </div>
  <div class="legend">
    <span><b>Primary set:</b> Heroicons 24-outline + 16-solid</span>
    <span><b>Brand SVGs:</b> partners, strategy diagrams, Subtract orbit</span>
  </div>
  <div class="legend">
    <span><b>No emoji</b> · <b>No icon font</b> · stroke 1.5px · square caps · rounded joins</span>
  </div>
</div>
</body></html>
