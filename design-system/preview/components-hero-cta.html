<!doctype html>
<html><head><meta charset="utf-8"/><title>Components · Hero CTA</title>
<link rel="stylesheet" href="_card.css"/>
<style>
  .hero {
    position: relative;
    overflow: hidden;
    border-radius: var(--radius-lg);
    background:
      linear-gradient(300deg, rgba(241,240,235,0.5) 7.75%, rgba(88,191,110,0.5) 92.25%),
      linear-gradient(300deg, rgba(241,240,235,0.5) 7.75%, rgba(226,246,161,0.5) 92.25%),
      #F1F1EB;
    background-blend-mode: soft-light, hue, normal;
    padding: 36px;
    text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  .hero h1 { font-family: var(--font-display); font-weight: 600; font-size: 38px; line-height: 1.05; color: var(--hmn-green); letter-spacing: -0.02em; }
  .hero p  { font: 300 17px/1.4 "Aeonik", sans-serif; color: var(--hmn-green); opacity: 0.85; }
  .cta { background: var(--hmn-yellow); color: var(--hmn-green); padding: 12px 24px; border-radius: 9999px; font-weight: 500; font-size: 15px; box-shadow: 0 2px 8px rgba(23,49,50,0.12); border: 0; cursor: pointer; }
  .badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.75); backdrop-filter: blur(6px); padding: 6px 14px; border-radius: 9999px; font-size: 12px; color: var(--hmn-green); }
  .badge b { color: #0A6F46; font-weight: 600; }
  .orbit { position: absolute; bottom: -60px; left: 50%; transform: translateX(-50%); width: 460px; height: 200px; pointer-events: none; opacity: 0.35; }
</style></head>
<body>
<div class="card" style="background:#FAFAF8;padding:0;border:0">
  <div class="hero">
    <span class="badge">Live · Delta Neutral <b>10.68% APY</b></span>
    <h1>Reshaping Yield<br/>Optimization</h1>
    <p>Minimize Risk, Maximize Yield.</p>
    <button class="cta">Launch App ↗</button>
    <svg class="orbit" viewBox="0 0 460 200" fill="none">
      <path d="M40 100c40-60 120-90 200-50s140 30 180-20" stroke="#E2F6A1" stroke-width="2"/>
      <path d="M40 100c40 60 120 90 200 50s140-30 180 20" stroke="#E2F6A1" stroke-width="2"/>
    </svg>
  </div>
</div>
</body></html>
