<!doctype html>
<html><head><meta charset="utf-8"/><title>Colors · Partner accents</title>
<link rel="stylesheet" href="_card.css"/>
<style>
  .grid8 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .chip { padding: 10px 12px; border-radius: var(--radius-md); display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); }
  .swatch { width: 22px; height: 22px; border-radius: 6px; }
  .nm { font-weight: 500; font-size: 12px; color: var(--fg); }
  .hx { font-family: var(--font-mono); font-size: 10px; color: var(--fg-subtle); }
</style></head>
<body>
<div class="card">
  <div class="row" style="justify-content:space-between">
    <div class="label">Partner accents · per-vault</div>
    <div class="meta">colors</div>
  </div>
  <div class="grid8">
    <div class="chip"><div class="swatch" style="background:#FFAF1D"></div><div class="col"><span class="nm">Options</span><span class="hx">FFAF1D</span></div></div>
    <div class="chip"><div class="swatch" style="background:#627EEA"></div><div class="col"><span class="nm">Delta</span><span class="hx">627EEA</span></div></div>
    <div class="chip"><div class="swatch" style="background:#ACE730"></div><div class="col"><span class="nm">Renzo</span><span class="hx">ACE730</span></div></div>
    <div class="chip"><div class="swatch" style="background:#075A5A"></div><div class="col"><span class="nm">Kelp</span><span class="hx">075A5A</span></div></div>
    <div class="chip"><div class="swatch" style="background:#437BFF"></div><div class="col"><span class="nm">BSX</span><span class="hx">437BFF</span></div></div>
    <div class="chip"><div class="swatch" style="background:#B080FF"></div><div class="col"><span class="nm">Solv</span><span class="hx">B080FF</span></div></div>
    <div class="chip"><div class="swatch" style="background:#B4B4B8"></div><div class="col"><span class="nm">Pendle</span><span class="hx">B4B4B8</span></div></div>
    <div class="chip"><div class="swatch" style="background:#7F56D9"></div><div class="col"><span class="nm">Goldlink</span><span class="hx">7F56D9</span></div></div>
    <div class="chip"><div class="swatch" style="background:#1F5FFF"></div><div class="col"><span class="nm">Rethink</span><span class="hx">1F5FFF</span></div></div>
    <div class="chip"><div class="swatch" style="background:#50D2C1"></div><div class="col"><span class="nm">Hype</span><span class="hx">50D2C1</span></div></div>
  </div>
  <div class="meta">used on the partner-glow drop-shadow + the vault-card conic accent</div>
</div>
</body></html>
