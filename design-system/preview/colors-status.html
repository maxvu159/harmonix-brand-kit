<!doctype html>
<html><head><meta charset="utf-8"/><title>Colors · Status</title>
<link rel="stylesheet" href="_card.css"/>
<style>
  .row4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .cell { padding: 14px; border-radius: var(--radius-md); display: flex; flex-direction: column; gap: 10px; min-height: 116px; }
  .dot { width: 28px; height: 28px; border-radius: 50%; }
  .name { font-weight: 600; font-size: 13px; }
  .hex { font-family: var(--font-mono); font-size: 11px; opacity: 0.7; }
  .use { font-size: 11px; opacity: 0.8; }
</style></head>
<body>
<div class="card">
  <div class="row" style="justify-content:space-between">
    <div class="label">Status colors · functional</div>
    <div class="meta">colors</div>
  </div>
  <div class="row4">
    <div class="cell" style="background:#E8F8F1;color:#0A6F46;">
      <div class="dot" style="background:#0ECB81"></div>
      <div><div class="name">Success</div><div class="hex">#0ECB81</div></div>
      <div class="use">+APY · deposit ok</div>
    </div>
    <div class="cell" style="background:#FDECEA;color:#7A2424;">
      <div class="dot" style="background:#8F2C2C"></div>
      <div><div class="name">Danger</div><div class="hex">#8F2C2C</div></div>
      <div class="use">withdraw warn</div>
    </div>
    <div class="cell" style="background:#E6F1FE;color:#0B4F9F;">
      <div class="dot" style="background:#076EDE"></div>
      <div><div class="name">Info</div><div class="hex">#076EDE</div></div>
      <div class="use">highlight</div>
    </div>
    <div class="cell" style="background:#F8FEDA;color:#173132;">
      <div class="dot" style="background:#E2F6A1;border:1px solid #173132"></div>
      <div><div class="name">Warning</div><div class="hex">#E2F6A1</div></div>
      <div class="use">action req'd</div>
    </div>
  </div>
</div>
</body></html>
