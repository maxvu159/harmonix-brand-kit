<!doctype html>
<html><head><meta charset="utf-8"/><title>Type · UI scale</title>
<link rel="stylesheet" href="_card.css"/>
<style>
  .row-spec { display: flex; align-items: baseline; gap: 14px; }
  .row-spec .tk { font-family: var(--font-mono); font-size: 10px; color: var(--fg-subtle); width: 76px; flex-shrink: 0; }
  .row-spec .sp { font-family: var(--font-sans); color: var(--fg); line-height: 1.3; }
</style></head>
<body>
<div class="card">
  <div class="row" style="justify-content:space-between">
    <div class="label">UI scale · body, labels, captions</div>
    <div class="meta">type</div>
  </div>
  <div class="row-spec"><span class="tk">20 / 600</span><span class="sp" style="font-size:20px;font-weight:600">Active positions</span></div>
  <div class="row-spec"><span class="tk">16 / 500</span><span class="sp" style="font-size:16px;font-weight:500">Connect your wallet to deposit</span></div>
  <div class="row-spec"><span class="tk">14 / 400</span><span class="sp" style="font-size:14px;font-weight:400">Earn yield through funding fees and staked ETH while remaining delta neutral against USD.</span></div>
  <div class="row-spec"><span class="tk">12 / 400</span><span class="sp" style="font-size:12px;font-weight:400;color:var(--fg-muted)">Last updated 2 minutes ago</span></div>
  <div class="row-spec"><span class="tk">12 / 500 ↑</span><span class="sp" style="font-size:12px;font-weight:500;color:var(--fg-subtle);text-transform:uppercase;letter-spacing:0.04em">Total value locked</span></div>
</div>
</body></html>
