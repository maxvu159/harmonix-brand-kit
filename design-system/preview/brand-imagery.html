<!doctype html>
<html><head><meta charset="utf-8"/><title>Brand · Imagery</title>
<link rel="stylesheet" href="_card.css"/>
<style>
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .tile { aspect-ratio: 4/3; border-radius: var(--radius-md); overflow: hidden; position: relative; }
  .tile img { width: 100%; height: 100%; object-fit: cover; }
  .tile .lab { position: absolute; left: 8px; bottom: 8px; padding: 3px 8px; border-radius: 9999px; background: rgba(15,33,34,0.7); color: var(--hmn-yellow); font-size: 10px; font-family: var(--font-mono); }
  .blend {
    background:
      linear-gradient(300deg, rgba(241,240,235,0.5) 7.75%, rgba(88,191,110,0.5) 92.25%),
      linear-gradient(300deg, rgba(241,240,235,0.5) 7.75%, rgba(226,246,161,0.5) 92.25%),
      url("../assets/bg/bg.png") center/cover no-repeat;
    background-blend-mode: soft-light, hue, normal, normal;
  }
</style></head>
<body>
<div class="card">
  <div class="row" style="justify-content:space-between">
    <div class="label">Brand imagery · backgrounds & illustrations</div>
    <div class="meta">brand</div>
  </div>
  <div class="grid">
    <div class="tile blend"><span class="lab">bg blend · marketing</span></div>
    <div class="tile" style="background:#0F2122"><img src="../assets/bg/blur-logo.png" style="object-fit:contain;mix-blend-mode:overlay"/><span class="lab">blur-logo · hero glow</span></div>
    <div class="tile" style="background:#F1F1EB"><img src="../assets/illustrations/delta-neutral-works.png" style="object-fit:contain;padding:8px"/><span class="lab">strategy illustration</span></div>
  </div>
  <div class="meta">photographic atmosphere is soft-light-blended into the brand gradient · illustrations are flat schematic diagrams</div>
</div>
</body></html>
