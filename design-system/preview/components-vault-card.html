<!doctype html>
<html><head><meta charset="utf-8"/><title>Components · Vault card</title>
<link rel="stylesheet" href="_card.css"/>
<style>
  .stage {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
    padding: 16px 0 22px;
    background: #050B0E;
    border-radius: var(--radius-md);
    padding: 28px;
  }

  .vault {
    background: #0D1117;
    border-radius: var(--radius-lg);
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    border: 1px solid rgba(255,255,255,0.06);
    position: relative;
    transition: transform .3s var(--ease-out), border-color .3s var(--ease-out), box-shadow .3s var(--ease-out);
    font-family: "Aeonik", sans-serif;
  }
  .vault.hov {
    border-color: #F5A524;
    transform: translate(-3px, 3px);
    box-shadow: 5px -5px 0 #F5A524;
  }

  .head { display: flex; align-items: center; gap: 12px; }
  .ic {
    width: 40px; height: 40px;
    border-radius: 11px;
    background: #173132;
    display: flex; align-items: center; justify-content: center;
    color: #E2F6A1;
    flex-shrink: 0;
    border: 1px solid rgba(226,246,161,0.18);
  }
  .ic svg { width: 22px; height: 22px; }
  .vault.hov .ic { background: #1F1408; color: #F5A524; border-color: rgba(245,165,36,0.4); }

  .name {
    font-family: "Aeonik", sans-serif;
    font-weight: 500;
    font-size: 16px;
    color: #F5F6F6;
    line-height: 1.2;
  }
  .sub  {
    font-family: "Aeonik", sans-serif;
    font-size: 11px;
    font-weight: 400;
    color: rgba(245,246,246,0.45);
    margin-top: 2px;
  }

  .apy { display: flex; align-items: baseline; gap: 8px; }
  .apy .v {
    font-family: "Aeonik", sans-serif;
    font-size: 40px;
    font-weight: 700;
    color: #E2F6A1;
    letter-spacing: 0;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .vault.hov .apy .v { color: #F5A524; }
  .apy .u {
    font-family: "Aeonik", sans-serif;
    font-size: 12px;
    font-weight: 400;
    color: rgba(245,246,246,0.5);
  }

  .row3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border-top: 1px solid rgba(255,255,255,0.07);
    padding-top: 14px;
    gap: 8px;
  }
  .row3 .cell { display: flex; flex-direction: column; gap: 4px; }
  .row3 .l {
    font-family: "Aeonik", sans-serif;
    font-size: 10px;
    font-weight: 400;
    color: rgba(245,246,246,0.4);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .row3 .v {
    font-family: "Aeonik", sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: #F5F6F6;
    font-variant-numeric: tabular-nums;
  }

  .legend {
    font-family: "Aeonik", sans-serif;
    font-size: 10px;
    font-weight: 400;
    color: rgba(245,246,246,0.4);
    text-align: center;
    margin-top: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
</style></head>
<body>
<div class="card">
  <div class="row" style="justify-content:space-between">
    <div class="label">Vault card · default & hover</div>
    <div class="meta">components</div>
  </div>
  <div class="stage">
    <div>
      <div class="vault">
        <div class="head">
          <div class="ic">
            <!-- delta-neutral glyph -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19h16L12 5z"/>
              <path d="M8 14h8" stroke-dasharray="2 2"/>
            </svg>
          </div>
          <div class="col">
            <span class="name">Delta Neutral Vault</span>
            <span class="sub">USDC · perp-funding + spot</span>
          </div>
        </div>
        <div class="apy"><span class="v">10.68%</span><span class="u">7d APY</span></div>
        <div class="row3">
          <div class="cell"><span class="l">TVL</span><span class="v">$8.2M</span></div>
          <div class="cell"><span class="l">Capacity</span><span class="v">$15M</span></div>
          <div class="cell"><span class="l">Lock</span><span class="v">7d</span></div>
        </div>
      </div>
      <div class="legend">default</div>
    </div>
    <div>
      <div class="vault hov">
        <div class="head">
          <div class="ic">
            <!-- option-wheel glyph -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="8"/>
              <path d="M12 4v4M12 16v4M4 12h4M16 12h4"/>
            </svg>
          </div>
          <div class="col">
            <span class="name">Option Wheel Vault</span>
            <span class="sub">ETH · covered call + LP</span>
          </div>
        </div>
        <div class="apy"><span class="v">14.20%</span><span class="u">7d APY</span></div>
        <div class="row3">
          <div class="cell"><span class="l">TVL</span><span class="v">$4.6M</span></div>
          <div class="cell"><span class="l">Capacity</span><span class="v">$10M</span></div>
          <div class="cell"><span class="l">Lock</span><span class="v">14d</span></div>
        </div>
      </div>
      <div class="legend">hover · #F5A524 peel</div>
    </div>
  </div>
</div>
</body></html>
