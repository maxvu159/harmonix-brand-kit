<!doctype html>
<html><head><meta charset="utf-8"/><title>Components · Sidebar nav</title>
<link rel="stylesheet" href="_card.css"/>
<style>
  .stage { background: #07161D; border-radius: var(--radius-md); padding: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .grp { display: flex; flex-direction: column; gap: 8px; }
  .ttl { font-size: 11px; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 0.06em; padding-left: 4px; font-family: var(--font-mono); }
  .item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; color: rgba(255,255,255,0.7); font-size: 13px; cursor: pointer; transition: background .15s; }
  .item:hover { background: #10272B; }
  .item.active { background: #10272B; color: var(--hmn-yellow); }
  .item svg { width: 16px; height: 16px; flex-shrink: 0; }
  .pillv { margin-left: auto; font-size: 10px; padding: 2px 7px; border-radius: 9999px; background: rgba(226,246,161,0.18); color: var(--hmn-yellow); }
</style></head>
<body>
<div class="card dark">
  <div class="row" style="justify-content:space-between">
    <div class="label" style="color:rgba(255,255,255,0.6)">Sidebar nav · groups + active</div>
    <div class="meta">components</div>
  </div>
  <div class="stage">
    <div class="grp">
      <div class="ttl">Products</div>
      <div class="item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg>Yield Markets<span class="pillv">NEW</span></div>
      <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Stake</div>
      <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 7l-4 4 4 4M16 7l4 4-4 4"/></svg>Swap</div>
    </div>
    <div class="grp">
      <div class="ttl">Stats</div>
      <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 21V10l9-7 9 7v11H3z"/></svg>Portfolio</div>
      <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="13" width="4" height="8"/><rect x="10" y="8" width="4" height="13"/><rect x="17" y="3" width="4" height="18"/></svg>Dashboard</div>
      <div class="ttl" style="margin-top:6px">Rewards</div>
      <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M7 12h10"/></svg>Points Reward</div>
    </div>
  </div>
</div>
</body></html>
