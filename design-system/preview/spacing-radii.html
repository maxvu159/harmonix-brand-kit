<!doctype html>
<html><head><meta charset="utf-8"/><title>Radii</title>
<link rel="stylesheet" href="_card.css"/>
<style>
  .grid6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .r { aspect-ratio: 1; background: var(--hmn-green); display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--hmn-yellow); gap: 4px; }
  .r .v { font-family: var(--font-mono); font-size: 11px; opacity: 0.8; }
  .r .n { font-size: 10px; opacity: 0.55; letter-spacing: 0.04em; text-transform: uppercase; }
</style></head>
<body>
<div class="card">
  <div class="row" style="justify-content:space-between">
    <div class="label">Corner radii</div>
    <div class="meta">spacing</div>
  </div>
  <div class="grid6">
    <div class="r" style="border-radius:4px">  <div class="n">xs</div><div class="v">4</div></div>
    <div class="r" style="border-radius:8px">  <div class="n">sm</div><div class="v">8</div></div>
    <div class="r" style="border-radius:12px"> <div class="n">md</div><div class="v">12</div></div>
    <div class="r" style="border-radius:16px"> <div class="n">lg</div><div class="v">16</div></div>
    <div class="r" style="border-radius:24px"> <div class="n">xl</div><div class="v">24</div></div>
    <div class="r" style="border-radius:9999px"><div class="n">pill</div><div class="v">∞</div></div>
  </div>
  <div class="meta">cards 16 · large containers 24/32 · buttons & badges pill · logo glyph tile 13.13</div>
</div>
</body></html>
